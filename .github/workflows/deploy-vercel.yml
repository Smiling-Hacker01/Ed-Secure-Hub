# ========================================================
# EdSecure Hub - Vercel CI/CD Pipeline
# Triggers on push to main branch
# Stages: Lint/Test → Build → Deploy to Vercel
# ========================================================

name: Deploy to Vercel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Ensure only one deployment runs at a time
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────
  # Stage 1: Lint, Build, and Test
  # ─────────────────────────────────────────────────────────
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Build application
        run: npm run build
        env:
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/test_db?sslmode=disable
          JWT_SECRET: ci-test-secret-key-not-for-production-use-min-32-chars

      - name: Run tests
        run: npm run test
        env:
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/test_db?sslmode=disable
          JWT_SECRET: ci-test-secret-key-not-for-production-use-min-32-chars

  # ─────────────────────────────────────────────────────────
  # Stage 2: Deploy to Vercel
  # Only runs on push to main (not on PRs)
  # ─────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Vercel
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Vercel CLI
        run: npm i -g vercel

      - name: Pull Vercel Environment Settings
        run: vercel env pull .env.production --token ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        run: vercel --prod --token ${{ secrets.VERCEL_TOKEN }} --yes

      - name: Notify deployment success
        if: success()
        run: |
          echo "🚀 Ed-Secure Hub deployed successfully to Vercel"
          echo "   Commit: ${{ github.sha }}"