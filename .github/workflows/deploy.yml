# ========================================================
# EdSecure Hub - Production CI/CD Pipeline
# Triggers on push to main branch
# Stages: Lint/Test → Build Docker Image → Deploy to Server
# ========================================================

name: Deploy Ed-Secure Hub

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  NODE_VERSION: "22"

# Ensure only one deployment runs at a time
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────
  # Stage 1: Lint, Build, and Test
  # ─────────────────────────────────────────────────────────
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Build application
        run: npm run build
        env:
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/test_db?sslmode=disable
          JWT_SECRET: ci-test-secret-key-not-for-production-use-min-32-chars

      - name: Run tests
        run: npm run test
        env:
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/test_db?sslmode=disable
          JWT_SECRET: ci-test-secret-key-not-for-production-use-min-32-chars

  # ─────────────────────────────────────────────────────────
  # Stage 2: Build & Push Docker Image to GHCR
  # Only runs on push to main (not on PRs)
  # ─────────────────────────────────────────────────────────
  build:
    name: Build & Push Image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────
  # Stage 3: Deploy to Production Server
  # SSH into the server, pull the new image, restart the app
  # ─────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          script: |
            set -e

            echo "═══════════════════════════════════════════"
            echo "  EdSecure Hub — Production Deployment"
            echo "  Commit: ${{ github.sha }}"
            echo "  Time:   $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "═══════════════════════════════════════════"

            cd /opt/edsecure

            # Pull the latest image
            echo "▸ Pulling latest image..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull app

            # Create a backup tag of the current running image for rollback
            CURRENT_IMAGE=$(docker inspect --format='{{.Image}}' edsecure-app 2>/dev/null || echo "none")
            echo "▸ Current image: ${CURRENT_IMAGE}"

            # Rolling restart — only recreate the app container
            echo "▸ Restarting app container..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-deps app

            # Wait for the app to become healthy
            echo "▸ Waiting for health check..."
            sleep 10

            HEALTH_STATUS=$(curl -sf http://localhost:3000/api/health | head -c 500 || echo "FAILED")
            echo "▸ Health response: ${HEALTH_STATUS}"

            if echo "${HEALTH_STATUS}" | grep -q "HEALTHY"; then
              echo "✅ Deployment successful!"
            else
              echo "❌ Health check failed! Rolling back..."
              docker compose -f docker-compose.yml -f docker-compose.prod.yml rollback app 2>/dev/null || \
                docker compose -f docker-compose.yml -f docker-compose.prod.yml restart app
              exit 1
            fi

            # Clean up old images
            docker image prune -f

      - name: Notify deployment success
        if: success()
        run: |
          echo "🚀 Ed-Secure Hub deployed successfully"
          echo "   Commit: ${{ github.sha }}"
          echo "   Image:  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
