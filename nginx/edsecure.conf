# ========================================================
# EdSecure Hub - Nginx Reverse Proxy Configuration
# ========================================================
#
# Installation:
#   1. sudo cp nginx/edsecure.conf /etc/nginx/sites-available/edsecure
#   2. sudo ln -s /etc/nginx/sites-available/edsecure /etc/nginx/sites-enabled/
#   3. sudo rm /etc/nginx/sites-enabled/default
#   4. sudo certbot --nginx -d edsecure.example.com
#   5. sudo nginx -t && sudo systemctl reload nginx
#
# Replace "edsecure.example.com" with your actual domain.
# ========================================================

# ── Rate Limiting Zones ───────────────────────────────────
# API endpoints: 30 requests/minute per IP
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;

# Auth endpoints: 5 requests/minute per IP (brute-force protection)
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

# General pages: 60 requests/minute per IP
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=60r/m;

# ── Upstream ──────────────────────────────────────────────
upstream edsecure_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# ── HTTP → HTTPS Redirect ────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name edsecure.example.com;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS Server ─────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name edsecure.example.com;

    # ── TLS Configuration ─────────────────────────────────
    # Managed by Certbot (paths updated after running certbot)
    ssl_certificate     /etc/letsencrypt/live/edsecure.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/edsecure.example.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/edsecure.example.com/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # ── Security Headers ──────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    # ── Request Size Limits ───────────────────────────────
    # Evidence uploads: max 50MB
    client_max_body_size 50M;
    client_body_timeout 60s;
    client_header_timeout 30s;

    # ── Gzip Compression ─────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ── Auth Endpoints (strict rate limit) ────────────────
    location ~ ^/api/auth/(login|register) {
        limit_req zone=auth_limit burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://edsecure_app;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    # ── API Endpoints ─────────────────────────────────────
    location /api/ {
        limit_req zone=api_limit burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://edsecure_app;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    # ── Next.js Static Assets ─────────────────────────────
    location /_next/static/ {
        proxy_pass http://edsecure_app;
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Public Static Files ───────────────────────────────
    location /favicon.ico {
        proxy_pass http://edsecure_app;
        expires 30d;
        access_log off;
    }

    # ── Health Check (no rate limit) ──────────────────────
    location = /api/health {
        proxy_pass http://edsecure_app;
        include /etc/nginx/snippets/proxy-params.conf;
        access_log off;
    }

    # ── All Other Routes (Next.js pages) ──────────────────
    location / {
        limit_req zone=general_limit burst=20 nodelay;

        proxy_pass http://edsecure_app;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    # ── Block Sensitive Paths ─────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ── Custom Error Pages ────────────────────────────────
    error_page 429 /429.html;
    location = /429.html {
        internal;
        default_type text/html;
        return 429 '<!DOCTYPE html><html><head><title>Rate Limited</title></head><body><h1>Too Many Requests</h1><p>Please slow down and try again shortly.</p></body></html>';
    }

    # ── Logging ───────────────────────────────────────────
    access_log /var/log/nginx/edsecure_access.log combined buffer=16k flush=5s;
    error_log  /var/log/nginx/edsecure_error.log warn;
}
