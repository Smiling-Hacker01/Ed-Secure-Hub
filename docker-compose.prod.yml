# ========================================================
# EdSecure Hub - Production Docker Compose Overrides
# ========================================================
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# This file overrides the base docker-compose.yml for production:
#   1. Uses pre-built image from GHCR instead of building locally
#   2. Injects secrets via environment variables (from .env file)
#   3. Closes database & Redis ports to external access
#   4. Adds resource limits and structured logging
#   5. Enables persistent block-storage volumes
#
# Required secrets in .env:
#   DATABASE_URL, JWT_SECRET, POSTGRES_PASSWORD, REDIS_PASSWORD
# ========================================================

services:
  # ── Application ──────────────────────────────────────────
  app:
    # Use the pre-built image from GHCR (override local build)
    image: ${EDSECURE_IMAGE:-ghcr.io/your-org/ed-secure-hub:latest}
    build: !reset null
    container_name: edsecure-app
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - NATIONAL_HELPLINE=${NATIONAL_HELPLINE:-1930}
      - PLATFORM_BASE_URL=${PLATFORM_BASE_URL:-https://edsecure.example.com}
    # Resource constraints
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
        reservations:
          memory: 512M
          cpus: "0.5"
    # Structured logging with rotation
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
        tag: "edsecure-app"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── PostgreSQL ───────────────────────────────────────────
  postgres:
    container_name: edsecure-postgres
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-edsecure_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-edsecure_db}
    # SECURITY: Remove external port exposure — app connects via internal network
    ports: !reset []
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seeds.sql:/docker-entrypoint-initdb.d/02_seeds.sql:ro
      # WAL archiving directory for point-in-time recovery
      - postgres_wal:/var/lib/postgresql/wal_archive
    command: >
      postgres
        -c ssl=on
        -c ssl_cert_file=/var/lib/postgresql/data/server.crt
        -c ssl_key_file=/var/lib/postgresql/data/server.key
        -c log_statement=mod
        -c log_min_duration_statement=1000
        -c shared_preload_libraries=pg_stat_statements
        -c max_connections=100
        -c shared_buffers=256MB
        -c effective_cache_size=768MB
        -c work_mem=4MB
    logging:
      driver: json-file
      options:
        max-size: "25m"
        max-file: "3"

  # ── Redis ────────────────────────────────────────────────
  redis:
    container_name: edsecure-redis
    restart: always
    # SECURITY: Remove external port exposure
    ports: !reset []
    command: >
      redis-server
        --requirepass ${REDIS_PASSWORD}
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
        --appendonly yes
        --appendfsync everysec
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
    driver: local
  postgres_wal:
    driver: local
  redis_data:
    driver: local
