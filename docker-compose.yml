version: '3.8'

services:
  # 1. EdSecure Next.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: edsecure-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://edsecure_admin:EdSecure_Postgres_Password_2026@postgres:5432/edsecure_db?sslmode=disable
      - JWT_SECRET=edsecure_super_secure_production_secret_key_2026_at_least_32_chars
      - REDIS_URL=redis://redis:6379
      - NATIONAL_HELPLINE=1930
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - edsecure-net

  # 2. PostgreSQL Relational Database
  postgres:
    image: postgres:16-alpine
    container_name: edsecure-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=edsecure_admin
      - POSTGRES_PASSWORD=EdSecure_Postgres_Password_2026
      - POSTGRES_DB=edsecure_db
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/seeds.sql:/docker-entrypoint-initdb.d/02_seeds.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edsecure_admin -d edsecure_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - edsecure-net

  # 3. Redis Queue Cache
  redis:
    image: redis:7-alpine
    container_name: edsecure-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - edsecure-net

networks:
  edsecure-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
